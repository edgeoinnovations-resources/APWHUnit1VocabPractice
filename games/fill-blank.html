<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type the term — AP World Vocabulary</title>
<link rel="stylesheet" href="../assets/styles.css">
<script>window.APWH_BASE='../';</script>
<script src="../assets/data-loader.js"></script>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">AP World History</a><a class="crumb" id="back" href="#">&larr; Unit</a><span class="spacer"></span><span class="counter" id="count"></span></div>
<div class="wrap">
  <div class="kicker">Type the term</div>
  <h1 style="font-size:28px">Free recall</h1>
  <p class="sub">Read the clue and type the term. The answer stays hidden — keep trying until it's right. (Spelling is forgiving on accents and apostrophes.)</p>
  <div class="progress"><i id="bar"></i></div>
  <div class="panel">
    <div class="prompt" id="prompt">Which term is described below?</div>
    <div class="bigdef" id="clue"></div>
    <div style="margin-top:16px"><input type="text" id="entry" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the term…"></div>
    <div class="tf" id="tf"></div>
    <div class="controls">
      <button class="btn primary" id="check" type="button">Check</button>
      <button class="btn ghost" id="hint" type="button">Show a hint</button>
      <span class="spacer"></span>
      <button class="btn" id="next" type="button" disabled>Next &rarr;</button>
    </div>
  </div>
</div>
<script>
function norm(s){ return s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019\u02bc']/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]+/g,''); }
APWH.load(function(unit, id){
  document.getElementById('back').href = '../hub.html?unit=' + id;
  var order = APWH.shuffle(unit.terms.map(function(_,i){return i;})), pos=0, misses=0;
  var entry=document.getElementById('entry'), tf=document.getElementById('tf');
  function render(){
    var t = unit.terms[order[pos]]; misses=0;
    var clue = t.sentence ? t.sentence : t.definition;
    document.getElementById('clue').textContent = clue;
    document.getElementById('count').textContent = (pos+1)+' / '+order.length;
    document.getElementById('bar').style.width = (pos/order.length*100)+'%';
    entry.value=''; entry.disabled=false; tf.textContent=''; tf.className='tf';
    document.getElementById('next').disabled=true; document.getElementById('check').disabled=false;
    document.getElementById('hint').disabled=false; entry.focus();
  }
  function check(){
    var t = unit.terms[order[pos]];
    if (norm(entry.value)===norm(t.term)){
      tf.textContent='Correct! \u2014 '+t.term; tf.className='tf ok';
      entry.disabled=true; document.getElementById('check').disabled=true; document.getElementById('hint').disabled=true;
      document.getElementById('next').disabled=false; APWH.play(unit, t);
    } else {
      misses++; tf.textContent = misses>=2 ? 'Still not it — try the hint below.' : 'Not quite — try again.'; tf.className='tf no';
      entry.select();
    }
  }
  document.getElementById('check').addEventListener('click', check);
  entry.addEventListener('keydown', function(e){ if(e.key==='Enter') check(); });
  document.getElementById('hint').addEventListener('click', function(){
    var t = unit.terms[order[pos]];
    tf.textContent = 'Hint: starts with "'+t.term[0]+'" \u00b7 '+t.term.replace(/[^A-Za-z\u00C0-\u024f]/g,'').length+' letters'; tf.className='tf';
  });
  document.getElementById('next').addEventListener('click', function(){
    pos++;
    if (pos>=order.length){ document.querySelector('.panel').innerHTML='<div class="bigterm">All done!</div><p class="sub">You recalled and typed every term.</p>'; document.getElementById('bar').style.width='100%'; return; }
    render();
  });
  render();
});
</script>
</body>
</html>
